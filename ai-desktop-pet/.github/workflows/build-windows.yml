name: build-windows

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: |
          pip install -r requirements.txt pyinstaller

      - name: PyInstaller 打包
        run: |
          pyinstaller --clean --noconfirm build\desktop-pet.spec

      - name: 生成 NSIS 安装程序
        run: |
          makensis /DAPP_DIR="dist\AIDesktopPet" build\installer.nsi
        continue-on-error: true

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: AIDesktopPet-Windows
          path: |
            dist/AIDesktopPet/
            dist/AIDesktopPet-Setup.exe

      - name: 发布 Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/AIDesktopPet-Setup.exe
